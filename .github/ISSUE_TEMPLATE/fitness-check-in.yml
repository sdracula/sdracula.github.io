name: 健身打卡
description: 记录一次训练，自动更新个人主页健身日历
title: '[健身打卡] '
body:
  - type: markdown
    attributes:
      value: '填写完成后提交即可，支持补打卡。同一天多次训练会累计时长。编辑这条记录可更正，关闭记录可取消打卡。'
  - type: input
    id: date
    attributes:
      label: 日期
      description: '北京时间，格式 YYYY-MM-DD，可填写今天或过去日期'
      placeholder: '2026-10-10'
    validations:
      required: true
  - type: dropdown
    id: activity
    attributes:
      label: 训练项目
      options:
        - 力量训练
        - 跑步
        - 骑行
        - 游泳
        - 瑜伽 / 拉伸
        - 其他运动
    validations:
      required: true
  - type: input
    id: minutes
    attributes:
      label: 时长（分钟）
      description: '填写 1—1440 之间的整数，例如 45'
      placeholder: '45'
    validations:
      required: true
