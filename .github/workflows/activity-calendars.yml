name: Update activity calendars and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, deleted]

permissions:
  contents: read

concurrency:
  group: activity-calendars-pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'issues' || (github.event.issue.user.login == 'sdracula' && startsWith(github.event.issue.title, '[健身打卡]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Build article calendar
        run: node scripts/build-article-calendar.mjs
      - name: Update fitness check-ins
        id: fitness
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-fitness.mjs
      - name: Sync public LeetCode CN calendar
        id: leetcode
        continue-on-error: true
        run: node scripts/sync-leetcode-cn.mjs sdracula data/leetcode.json
      - name: Preserve successful snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update activity calendar snapshots'
            git push origin HEAD:main
          fi
      - name: Package static website
        run: node scripts/package-site.mjs
      - name: Upload static website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: '_site'
      - name: Report stale sources
        if: steps.fitness.outcome == 'failure' || steps.leetcode.outcome == 'failure'
        run: echo 'A source could not be refreshed. The last successful snapshot is retained.'

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
